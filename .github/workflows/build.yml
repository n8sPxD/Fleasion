name: Build PyInstaller Windows Package

on:
  workflow_call:
    outputs:
      app_version:
        description: Application version from pyproject.toml.
        value: ${{ jobs.prepare.outputs.app_version }}
      artifact_version:
        description: Version label used for build artifact filenames.
        value: ${{ jobs.prepare.outputs.artifact_version }}
      is_prerelease:
        description: Whether the canonical application version is a prerelease.
        value: ${{ jobs.prepare.outputs.is_prerelease }}
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHONHASHSEED: '0'
  SOURCE_DATE_EPOCH: '0'
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  prepare:
    name: Prepare package metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Resolve build versions
        id: version
        run: |
          app_version="$(uv version --short)"
          artifact_version="$(uv run --no-project --with packaging python src/fleasion/version.py --artifact-version "$app_version")"
          if [ "$app_version" = "$artifact_version" ]; then
            is_prerelease=false
          else
            is_prerelease=true
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install UPX
        shell: pwsh
        run: |
          $maxRetries = 5
          $maxAttempts = $maxRetries + 1
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installing UPX (attempt $attempt/$maxAttempts)..."
            choco install upx -y --no-progress
            $installExitCode = $LASTEXITCODE

            if ($installExitCode -eq 0) {
              if (Get-Command upx -ErrorAction SilentlyContinue) {
                upx --version
                if ($LASTEXITCODE -eq 0) {
                  break
                }
              }
            }

            if ($attempt -eq $maxAttempts) {
              throw "UPX installation failed after $maxRetries attempts."
            }

            $delaySeconds = [int][Math]::Min(60, [Math]::Pow(2, $attempt) * 5)
            Write-Host "Retrying UPX installation in $delaySeconds seconds..."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Test Windows Qt startup path
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          uv run pytest -q
          tests/test_qt_startup_diagnostics.py
          tests/test_build_script.py

      - name: Build package
        run: uv run build

      - name: Verify Windows package payload
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/Fleasion-v*-Windows.exe | Select-Object -First 1
          if (-not $exe) {
            throw 'Could not find the Windows executable in dist/.'
          }
          $listing = uv run pyi-archive_viewer -r -b -l $exe.FullName | Out-String
          foreach ($required in @(
            'fleasion.cache.obj_viewer',
            'fleasion.cache.animation_viewer',
            'fleasion.proxy.h2_transport',
            'fleasion.proxy.splice',
            'fleasion.proxy.splice_keys',
            'h2.connection',
            'hyperframe.frame',
            'QtOpenGL',
            'opengl32sw.dll'
          )) {
            if ($listing -notmatch [regex]::Escape($required)) {
              throw "Windows package is missing required payload: $required"
            }
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Fleasion-v${{ needs.prepare.outputs.artifact_version }}-Windows.exe
          path: dist/Fleasion-v*-Windows.exe
          archive: false
          if-no-files-found: error
